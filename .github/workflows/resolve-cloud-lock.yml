name: One-time Cloud Lock Resolver

on:
  push:
    branches: ["feat/gen-231-cloud-persistence"]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve optional cloud dependencies
        run: |
          python -m pip install uv==0.13.8
          uv lock
      - name: Commit generated lockfile to same branch
        run: |
          if git diff --quiet -- uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(gen-231): resolve cloud extras lock"
          git push origin HEAD:feat/gen-231-cloud-persistence
