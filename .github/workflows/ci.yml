name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**", "gpolukarov/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      TEST_CLOUD_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/yougile_cloud_test
      TEST_CLOUD_VALKEY_URL: redis://127.0.0.1:6379/13
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yougile_cloud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and locked package dependencies
        run: python -m pip install uv==0.13.8 && uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked ruff check .
      - name: Compile
        run: uv run --locked python -m compileall -q src scripts tests
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Agent contracts and path-routing check
        run: |
          uv run --locked python scripts/agent_contracts.py check
          uv run --locked python scripts/agent_contracts.py for src/yougile_mcp/config.py
      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py
      - name: Catalog invariant check
        run: uv run --locked python scripts/check_catalog.py
      - name: Config diagnostic
        run: uv run --locked python -m yougile_mcp doctor

  docker:
    name: Docker build (no public port)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate private Docker Compose topology
        env:
          MCP_DOMAIN: mcp.example.test
          TRAEFIK_CERTRESOLVER: testresolver
          ACME_EMAIL: admin@example.test
          CLOUD_DB_PASSWORD: 123456789abcdef123456789abcdef123456789abcdef123456789
          CLOUD_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
          CLOUD_ENCRYPTION_KEYS: cGxhY2Vob2xkZXJrZXlmb3Jjb21wb3NlLW9ubHktYWJjZA==
        run: |
          docker compose -f deploy/compose.yml config -q
          docker compose -f deploy/compose.tunnel.yml config -q
          docker compose -f deploy/compose.edge.yml config -q
      - name: Check official Traefik and socket-proxy images
        env:
          ACME_EMAIL: admin@example.test
        run: docker compose -f deploy/compose.edge.yml pull --quiet
      - name: Build image
        run: docker build -t yougile-mcp:foundation .
      - name: Verify image
        run: docker run --rm yougile-mcp:foundation
