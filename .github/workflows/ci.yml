name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**", "gpolukarov/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and locked package dependencies
        run: python -m pip install uv==0.13.8 && uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked ruff check .
      - name: Compile
        run: uv run --locked python -m compileall -q src scripts tests
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Agent contracts and path-routing check
        run: |
          uv run --locked python scripts/agent_contracts.py check
          uv run --locked python scripts/agent_contracts.py for src/yougile_mcp/config.py
      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py
      - name: Catalog invariant check
        run: uv run --locked python scripts/check_catalog.py
      - name: Config diagnostic
        run: uv run --locked python -m yougile_mcp doctor

  docker:
    name: Docker build (no public port)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t yougile-mcp:foundation .
      - name: Verify image
        run: docker run --rm yougile-mcp:foundation
