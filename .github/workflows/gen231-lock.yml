name: GEN-231 dependency lock bootstrap (temporary)
on:
  push:
    branches: ["feat/gen-231-mcp-sdk-runtime"]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.13.8
      - name: Generate MCP SDK v2 resolved lock
        run: uv lock
      - name: Emit generated lock file for review
        run: |
          echo __GEN231_LOCK_BEGIN__
          cat uv.lock
          echo __GEN231_LOCK_END__
