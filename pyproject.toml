[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "yougile-mcp"
version = "0.0.1"
description = "Open-source self-hosted YouGile MCP server (foundation only)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "YouGile MCP contributors" }]
keywords = ["yougile", "mcp", "self-hosted", "agent"]
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "openapi-schema-validator>=0.6,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.17,<1", "pytest>=9,<10"]

[project.scripts]
yougile-mcp = "yougile_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["yougile_mcp*"]

[tool.setuptools.package-data]
yougile_mcp = ["api/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["catalog"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
